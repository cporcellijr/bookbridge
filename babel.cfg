# Babel extraction config.
#
# Templates: everything wrapped in _() / {% trans %}, including the strings in
# inline <script> blocks ({{ _('...')|tojson }}).
#
# Python: scoped to single files on purpose. `_` is a common throwaway loop
# variable in src/ (`for _ in range(...)`), so src/ is not walked as a whole;
# a file is listed here only once its display text is marked.
#   src/utils/user_config.py - integration field labels, group names and select
#                              options, marked with the no-op N_() and
#                              translated where they are shown.
#
# Extract with: pybabel extract -F babel.cfg -o messages.pot .

[python: src/utils/user_config.py]

[jinja2: templates/**.html]
extensions=jinja2.ext.i18n
