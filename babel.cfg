# Babel extraction config.
#
# Scope for this PR: Jinja templates only. Python-side strings (flash messages,
# JSON error bodies) are not wrapped yet, so no [python:] section — adding one
# would have pybabel walk src/ and, because `_` is a common throwaway loop
# variable there (`for _ in range(...)`), try to extract from those sites.
# The [python:] section arrives in a later PR together with `_()` wrapping.
#
# Extract with: pybabel extract -F babel.cfg -o messages.pot .

[jinja2: templates/**.html]
extensions=jinja2.ext.i18n
