<script src="{{ url_for('static', filename='js/acquisition_jobs.js') }}" defer></script>
{% if queue_view['running'] %}
<script>
(function () {
    let reorderSubmitting = false;
    document.querySelectorAll('.job-queue-move-actions form').forEach(function (form) {
        form.addEventListener('submit', function () {
            reorderSubmitting = true;
        });
    });
    window.setInterval(function () {
        const active = document.activeElement;
        const editing = active && (
            ['INPUT', 'TEXTAREA', 'SELECT'].includes(active.tagName)
            || active.isContentEditable
            || !!active.closest('[data-acquisition-editor]')
            || !!active.closest('#acquisition-jobs')
        );
        if (document.hidden || reorderSubmitting || editing || window.acquisitionJobActionActive || window.acquisitionJobEditorActive) return;
        window.location.reload();
    }, 20000);
})();
</script>
{% endif %}
