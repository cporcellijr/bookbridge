<style>
        .cleanup-group {
            display: flex;
            gap: 15px;
            align-items: center;
            margin-top: 5px;
        }

        .mt-20 {
            margin-top: 20px !important;
        }

        .flex-1 {
            flex: 1;
        }

        .m-0 {
            margin: 0 !important;
        }

        /* Container */
        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 40px 20px;
            padding-bottom: 100px;
        }

        /* Settings Form Structure */
        .settings-form {
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .settings-section {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            overflow: hidden;
        }

        .section-header {
            padding: 20px;
            background: rgba(255, 255, 255, 0.02);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
            /* No cursor pointer here anymore, controlled by switch if present */
            user-select: none;
        }

        .section-header h3 {
            font-size: 18px;
            color: #fff;
            margin: 0;
        }

        .section-body {
            padding: 20px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            transition: all 0.3s ease;
        }

        .section-body.collapsed {
            display: none;
        }

        .repoint-scroll {
            max-height: 320px;
            overflow-y: auto;
            border: 1px solid var(--border-color, #444);
            border-radius: 6px;
            padding: 8px;
        }

        .repoint-row {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 3px 0;
            font-size: 0.9em;
        }

        .repoint-list {
            margin: 4px 0 0 18px;
            font-size: 0.9em;
        }

        .repoint-choice {
            max-width: 100%;
        }

        .hidden {
            display: none !important;
        }

        .full-width {
            grid-column: span 2;
        }

        /* Form Inputs */
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group label {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.6);
            font-weight: 600;
        }

        .form-group input,
        .form-group select,
        .form-group textarea,
        .poll-row select,
        .poll-custom input[type="number"] {
            padding: 10px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            color: #fff;
            font-size: 14px;
            width: 100%;
        }

        .form-group textarea {
            min-height: 92px;
            resize: vertical;
            font-family: inherit;
        }

        .form-group select,
        .poll-row select {
            color-scheme: dark;
        }

        .form-group select option,
        .poll-row select option {
            background: #121212;
            color: #ffffff;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus,
        .poll-row select:focus,
        .poll-custom input[type="number"]:focus {
            outline: none;
            border-color: #667eea;
        }

        .help-text {
            font-size: 12px;
            line-height: 1.45;
            color: rgba(255, 255, 255, 0.58);
            margin-top: -4px;
        }

        .diagnostics-history {
            display: grid;
            gap: 10px;
        }

        .diagnostics-submission {
            padding: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.2);
        }

        .diagnostics-submission-header {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            color: rgba(255, 255, 255, 0.55);
            font-size: 12px;
        }

        .diagnostics-submission-status {
            color: #9fb2ff;
            font-weight: 600;
        }

        .diagnostics-submission-label {
            margin-top: 10px;
            color: rgba(255, 255, 255, 0.5);
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .diagnostics-submission-text {
            margin-top: 4px;
            color: rgba(255, 255, 255, 0.82);
            font-size: 13px;
            line-height: 1.45;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        /* Custom Checkbox */
        .checkbox-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(0, 0, 0, 0.2);
            padding: 12px;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            cursor: pointer;
        }

        /* Every on/off in the form is the same switch, whatever markup holds it. */
        .checkbox-wrapper input[type="checkbox"],
        .toggle-label input[type="checkbox"],
        .poll-settle input[type="checkbox"],
        .changed-only input[type="checkbox"] {
            -webkit-appearance: none;
            appearance: none;
            position: relative;
            flex: 0 0 36px;
            width: 36px;
            height: 20px;
            margin: 0;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.1);
            cursor: pointer;
            transition: background .2s;
            vertical-align: middle;
        }

        .checkbox-wrapper input[type="checkbox"]::before,
        .toggle-label input[type="checkbox"]::before,
        .poll-settle input[type="checkbox"]::before,
        .changed-only input[type="checkbox"]::before {
            content: "";
            position: absolute;
            top: 3px;
            left: 3px;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #ccc;
            transition: transform .2s;
        }

        .checkbox-wrapper input[type="checkbox"]:checked,
        .toggle-label input[type="checkbox"]:checked,
        .poll-settle input[type="checkbox"]:checked,
        .changed-only input[type="checkbox"]:checked {
            background: #667eea;
        }

        .checkbox-wrapper input[type="checkbox"]:checked::before,
        .toggle-label input[type="checkbox"]:checked::before,
        .poll-settle input[type="checkbox"]:checked::before,
        .changed-only input[type="checkbox"]:checked::before {
            transform: translateX(16px);
            background: #fff;
        }

        .checkbox-wrapper input[type="checkbox"]:focus-visible,
        .toggle-label input[type="checkbox"]:focus-visible,
        .poll-settle input[type="checkbox"]:focus-visible,
        .changed-only input[type="checkbox"]:focus-visible {
            outline: 2px solid #aab4f5;
            outline-offset: 2px;
        }

        .checkbox-wrapper label {
            margin: 0;
            cursor: pointer;
            color: #fff;
            font-size: 14px;
        }

        /* Toggle Switch */
        /* Hides the default checkbox but keeps it accessible/functional */
        .toggle-switch-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .toggle-switch {
            position: relative;
            width: 44px;
            height: 24px;
        }

        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(255, 255, 255, 0.1);
            transition: .4s;
            border-radius: 24px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: #ccc;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked+.slider {
            background-color: #667eea;
        }

        input:checked+.slider:before {
            transform: translateX(20px);
            background-color: #fff;
        }

        /* Flash Messages */
        .flash {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .flash-success {
            background: rgba(76, 175, 80, 0.1);
            border-color: rgba(76, 175, 80, 0.3);
            color: #81c784;
        }

        .flash-error {
            background: rgba(244, 67, 54, 0.1);
            border-color: rgba(244, 67, 54, 0.3);
            color: #e57373;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .section-body {
                grid-template-columns: 1fr;
            }

            .full-width {
                grid-column: span 1;
            }
        }

        .submit-bar {
            position: fixed;
            bottom: 20px;
            right: 20px;
            left: 20px;
            z-index: 90;
            max-width: 960px;
            margin: 0 auto;
            background: rgba(20, 20, 20, 0.9);
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);
            padding: 15px;
            border-radius: 12px;
            border: 1px solid rgba(102, 126, 234, 0.3);
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .restart-warn {
            color: #FF9800;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;

            .section-header-flat {
                background: none !important;
                border: none !important;
                padding-left: 0 !important;
                margin-bottom: 20px !important;
            }

            .section-header-flat h2 {
                font-size: 28px !important;
            }

            .section-highlight {
                border-color: rgba(102, 126, 234, 0.3) !important;
            }

            .text-primary {
                color: #667eea !important;
            }

            .toggle-label {
                font-size: 13px !important;
                color: rgba(255, 255, 255, 0.5) !important;
            }
        }

        /* ---- Settings tabbed layout (left sidebar) ---- */
        .settings-layout {
            display: flex;
            gap: 24px;
            align-items: flex-start;
        }

        .settings-sidebar {
            flex: 0 0 220px;
            position: sticky;
            top: 96px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            background: rgba(20, 20, 20, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 14px;
            padding: 10px;
        }

        .settings-tab {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            text-align: left;
            padding: 11px 14px;
            background: transparent;
            border: none;
            border-radius: 10px;
            color: #b8b8b8;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background .15s, color .15s;
        }

        .settings-tab:hover {
            background: rgba(255, 255, 255, 0.04);
            color: #fff;
        }

        .settings-tab.active {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.18), rgba(118, 75, 162, 0.18));
            color: #fff;
            box-shadow: inset 0 0 0 1px rgba(102, 126, 234, 0.35);
        }

        .settings-main {
            flex: 1 1 auto;
            min-width: 0;
        }

        .tab-panel {
            display: none;
        }

        .tab-panel.active {
            display: block;
        }

        /* Search and "only what I've changed" show matches from every tab. */
        .settings-main.filtering .tab-panel {
            display: block;
        }

        .settings-main.filtering .panel-intro {
            display: none;
        }

        .panel-intro {
            margin: 0 4px 14px;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.55);
        }

        .changed-only {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 12px;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.75);
            cursor: pointer;
        }

        .settings-legend {
            margin: 10px 0 0;
            font-size: 12px;
            line-height: 1.45;
            color: rgba(255, 255, 255, 0.5);
        }

        .restart-badge {
            display: inline-block;
            margin-left: 8px;
            padding: 1px 6px;
            border: 1px solid rgba(255, 152, 0, 0.45);
            border-radius: 999px;
            color: #FFB74D;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: .04em;
            text-transform: uppercase;
            vertical-align: middle;
        }

        .restart-badge.reader-badge {
            border-color: rgba(102, 126, 234, 0.5);
            color: #aab4f5;
        }

        .settings-legend .restart-badge {
            margin: 0 4px 0 0;
        }

        .reset-default {
            margin-left: 8px;
            padding: 0;
            border: none;
            background: none;
            color: #aab4f5;
            font-size: 11px;
            cursor: pointer;
            text-decoration: underline;
            vertical-align: middle;
        }

        .reset-default + .reset-default::before {
            content: none;
        }

        .reset-default::before {
            content: "● changed · ";
            display: inline-block;
            margin-right: 4px;
            color: #8c9eff;
            text-decoration: none;
        }

        .save-effect {
            color: rgba(255, 255, 255, 0.55);
            font-size: 13px;
        }

        .save-effect.warn {
            color: #FF9800;
            font-weight: 600;
        }

        /* Per-app check timers: one row per app instead of three fields each. */
        .merged-mixed-note {
            color: var(--warning);
        }

        .poll-row {
            grid-column: 1 / -1;
            display: grid;
            grid-template-columns: 190px 170px 1fr;
            gap: 10px;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .poll-row[hidden] {
            display: none;
        }

        .poll-name {
            color: #fff;
            font-size: 14px;
        }

        .poll-custom {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.7);
        }

        .poll-custom input[type="number"] {
            width: 90px;
        }

        .poll-settle {
            display: flex;
            align-items: center;
            gap: 6px;
            margin: 0 0 0 8px;
            cursor: pointer;
        }

        @media (max-width: 760px) {
            .poll-row {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 760px) {
            .settings-layout {
                flex-direction: column;
            }

            .settings-sidebar {
                position: static;
                flex-direction: row;
                flex-wrap: wrap;
                width: 100%;
            }

            .settings-tab {
                width: auto;
            }
        }

        /* ---- Users tab ---- */
        .users-table {
            width: 100%;
            border-collapse: collapse;
        }

        .users-table th,
        .users-table td {
            text-align: left;
            padding: 10px 8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.07);
            font-size: 13px;
        }

        .users-table th {
            color: #888;
            font-weight: 600;
        }

        .row-actions-flex {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .row-actions-flex form {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin: 0;
        }

        .u-badge {
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 10px;
        }

        .u-badge.admin {
            background: rgba(102, 126, 234, .2);
            color: #aab4f5;
        }

        .u-badge.user {
            background: #222;
            color: #aaa;
        }

        .u-badge.on {
            background: rgba(76, 175, 80, .15);
            color: #a5d6a7;
        }

        .u-badge.off {
            background: rgba(244, 67, 54, .15);
            color: #ff8a80;
        }

        .u-input {
            padding: 8px 10px;
            background: #0e0e0e;
            border: 1px solid #2c2c2c;
            border-radius: 7px;
            color: #fff;
            font-size: 13px;
        }

        .u-btn {
            padding: 8px 12px;
            border: none;
            border-radius: 7px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }

        .u-btn-sm {
            background: #222;
            color: #ddd;
        }

        .u-btn-danger {
            background: rgba(244, 67, 54, .2);
            color: #ff8a80;
        }

        .u-btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
        }

        .u-create {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
        }

        .u-msg {
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 14px;
        }

        .u-msg.ok {
            background: rgba(76, 175, 80, .12);
            border: 1px solid rgba(76, 175, 80, .4);
            color: #a5d6a7;
        }

        .u-msg.err {
            background: rgba(244, 67, 54, .12);
            border: 1px solid rgba(244, 67, 54, .4);
            color: #ff8a80;
        }

        /* Write-only tracker tag on integration headers */
        .tracker-tag {
            font-size: 11px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.45);
            background: rgba(255, 255, 255, 0.07);
            border-radius: 10px;
            padding: 2px 8px;
            margin-left: 8px;
            vertical-align: middle;
        }

        /* Collapsed advanced sub-section inside a settings card */
        details.advanced-sub summary {
            cursor: pointer;
            color: rgba(255, 255, 255, 0.55);
            font-size: 13px;
            font-weight: 600;
            user-select: none;
            padding: 4px 0;
        }

        details.advanced-sub summary:hover {
            color: #fff;
        }

        /* Integrations: service card headers */
        .svc-left {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
        }

{% if not settings_next %}
        .svc-chev {
            color: rgba(255, 255, 255, 0.35);
            font-size: 11px;
            flex: none;
            transition: transform .15s;
        }

        .settings-section:not(:has(.section-body.collapsed)) .svc-chev {
            transform: rotate(90deg);
        }

{% endif %}
        .svc-chip {
            width: 34px;
            height: 34px;
            border-radius: 9px;
            flex: none;
            background: rgba(102, 126, 234, 0.14);
            border: 1px solid rgba(102, 126, 234, 0.38);
            display: grid;
            place-items: center;
            font-family: ui-monospace, 'Cascadia Code', Consolas, monospace;
            font-size: 12px;
            font-weight: 700;
            color: #aab6f7;
        }

        .svc-title h3 {
            margin: 0;
        }

        .svc-desc {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.4);
        }

        .header-tail {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: none;
        }

        .pill {
            font-size: 11px;
            font-weight: 600;
            padding: 2px 9px;
            border-radius: 20px;
            white-space: nowrap;
        }

        .pill.ok {
            background: rgba(76, 175, 80, 0.13);
            color: #a5d6a7;
        }

        .pill.off {
            background: rgba(255, 255, 255, 0.06);
            color: rgba(255, 255, 255, 0.4);
        }

{% if not settings_next %}
        .settings-section[data-svc]>.section-header {
            cursor: pointer;
        }

        .settings-section[data-svc]>.section-header:hover {
            background: rgba(255, 255, 255, 0.04);
        }

{% endif %}
        /* Sidebar settings search */
        .settings-search {
            width: 100%;
            padding: 9px 12px;
            margin: 0 0 8px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: #fff;
            font-size: 13px;
        }

        .settings-search:focus {
            outline: none;
            border-color: #667eea;
        }

        /* Save-bar dirty counter */
        .dirty-note {
            margin-right: auto;
            color: #aab4f5;
            font-size: 13px;
            font-weight: 600;
        }
    </style>
{% if settings_next %}
<link rel="stylesheet" href="/static/css/next-p6.css">
{% endif %}
