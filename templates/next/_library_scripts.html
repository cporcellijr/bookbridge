<script>
            function checkForgeStatus(signal) {
                return fetch('/api/forge/active', { signal })
                    .then(r => r.json())
                    .then(tasks => {
                        const banner = document.getElementById('forge-status-banner');
                        const list = document.getElementById('forge-task-list');
                        if (tasks && tasks.length > 0) {
                            banner.style.display = 'flex';
                            const text = tasks.length === 1
                                ? bbFormat({{ _('Creating Storyteller edition: {title}')|tojson }}, { title: tasks[0] })
                                : bbPlural({% call(n) plural_forms() %}{{ ngettext('Creating {count} Storyteller edition...', 'Creating {count} Storyteller editions...', n) }}{% endcall %}, tasks.length);
                            list.textContent = text;
                        } else {
                            banner.style.display = 'none';
                        }
                        return !!(tasks && tasks.length > 0);
                    })
                    .catch(e => console.debug("Forge status check failed", e));
            }
            // 5s while a forge task is running or work was just started, 30s when idle
            // (tasks started elsewhere show up within one slow tick or on tab focus).
            window.bbForgePoll = bbPoller({ name: 'forge', fastMs: 5000, slowMs: 30000, run: checkForgeStatus });
            ['syncNow', 'remapAlignment', 'generateReadalongEpub'].forEach(function (name) {
                var original = window[name];
                if (typeof original !== 'function') return;
                window[name] = function () {
                    window.bbForgePoll.kick();
                    return original.apply(this, arguments);
                };
            });
        </script>
<script>
                // Make function globally available
                window.toggleSuggestions = function () {
                    const content = document.getElementById('suggestions-content');
                    const banner = document.getElementById('suggestions-banner');

                    if (!content || !banner) return;

                    const isShowing = content.classList.toggle('show');
                    banner.classList.toggle('active', isShowing);
                    banner.setAttribute('aria-expanded', String(isShowing));
                    document.getElementById('suggestions-section').hidden = !isShowing;

                    // Persist state in localStorage safely
                    try {
                        localStorage.setItem('suggestions_expanded', isShowing);
                    } catch (e) {
                        console.debug('LocalStorage error:', e);
                    }
                };

                // Initialize on load
                document.addEventListener('DOMContentLoaded', () => {
                    // Attach click handler
                    const banner = document.getElementById('suggestions-banner');
                    if (banner) {
                        banner.addEventListener('click', window.toggleSuggestions);
                    }

                    // Restore state
                    try {
                        const shouldExpand = localStorage.getItem('suggestions_expanded') === 'true';
                        if (shouldExpand) {
                            const content = document.getElementById('suggestions-content');
                            if (content && banner) {
                                content.classList.add('show');
                                banner.classList.add('active');
                                banner.setAttribute('aria-expanded', 'true');
                                document.getElementById('suggestions-section').hidden = false;
                            }
                        }
                    } catch (e) {
                        console.debug('LocalStorage error:', e);
                    }
                });

                function dismissSuggestion(e, id) {
                    e.preventDefault();
                    console.log('Dismissing suggestion:', id);
                    fetch(`/api/suggestions/${id}/dismiss`, { method: 'POST' })
                        .then(r => {
                            console.log('Response status:', r.status);
                            return r.json();
                        })
                        .then(data => {
                            console.log('Response data:', data);
                            if (data.success) {
                                const card = document.getElementById(`suggestion-${id}`);
                                if (card) {
                                    card.style.transition = 'opacity 0.3s';
                                    card.style.opacity = '0';
                                    setTimeout(() => { card.remove(); }, 300);
                                }
                            } else {
                                console.error('Dismiss failed:', data.error);
                            }
                        })
                        .catch(err => {
                            console.error('Fetch error:', err);
                        });
                }
            </script>
{% if mappings %}
<script>
            const libraryGrid = document.getElementById('library-grid');
            const sortSelect = document.getElementById('sort-select');
            const filterSelect = document.getElementById('filter-select');
            const statusFilter = document.getElementById('status-filter');
            const filterButton = document.getElementById('library-filter-button');
            const filterButtonLabel = document.getElementById('library-filter-button-label');
            const filterResetButton = document.getElementById('library-filter-reset');
            const filterClearButton = document.getElementById('library-filter-clear');
            const filterPanel = document.getElementById('library-filter-panel');
            const filterBackdrop = document.getElementById('library-filter-backdrop');
            const filterHost = document.getElementById('library-filter-host');
            const filterGroups = {status: statusFilter, format: filterSelect};
            let filterInitialized = false;
            let savedAttentionPreference = false;
            const seriesFilter = document.getElementById('series-filter');
            const authorFilter = document.getElementById('author-filter');
            filterGroups.author = authorFilter;
            filterGroups.series = seriesFilter;
            const filterCount = document.getElementById('filter-count');
            const attentionOnlyFilter = document.getElementById('attention-only-filter');
            const attentionPopover = document.getElementById('needs-attention');
            const attentionTrigger = attentionPopover?.querySelector('summary');
            if (attentionPopover) {
                function positionAttentionPopover() {
                    if (!attentionPopover.open) return;
                    const panel = attentionPopover.querySelector('.attention-list');
                    if (!panel) return;
                    panel.style.removeProperty('--attention-shift');
                    const bounds = panel.getBoundingClientRect();
                    const left = Math.max(14, Math.min(bounds.left, window.innerWidth - bounds.width - 14));
                    panel.style.setProperty('--attention-shift', (left - bounds.left) + 'px');
                }
                attentionPopover.addEventListener('toggle', positionAttentionPopover);
                window.addEventListener('resize', positionAttentionPopover);
                document.addEventListener('click', event => {
                    if (attentionPopover.open && !attentionPopover.contains(event.target)) {
                        attentionPopover.open = false;
                    }
                });
                document.addEventListener('keydown', event => {
                    if (event.key === 'Escape' && attentionPopover.open) {
                        event.preventDefault();
                        attentionPopover.open = false;
                        attentionTrigger?.focus();
                    }
                });
            }
            const directionBtn = document.getElementById('sort-direction');
            const dashboardSearch = document.getElementById('dashboard-search');
            const searchHandoff = document.getElementById('search-handoff');
            const searchHandoffMsg = document.getElementById('search-handoff-msg');
            const searchHandoffLink = document.getElementById('search-handoff-link');
            const addBookSearchUrl = '{{ url_for('suggestions', tab='search') }}&q=';
            const seriesGroupingToggle = document.getElementById('series-grouping-toggle');

            function hasVisibleGridItems() {
                if (!libraryGrid) return false;
                return Array.from(libraryGrid.children).some(entry =>
                    !entry.classList.contains('hidden') &&
                    entry.style.display !== 'none' &&
                    (entry.classList.contains('book-card') ||
                        (entry.classList.contains('series-group') &&
                            !document.body.classList.contains('series-grouping-off'))));
            }

            // Count every book once, regardless of its series presentation.
            function distinctBookCards() {
                const seen = new Map();
                document.querySelectorAll('.book-card').forEach(card => {
                    const absId = card.dataset.absId;
                    // The hero book leaves the grid as a standalone card; inside its series stack it stays.
                    const heroHidden = card.dataset.heroExcluded === 'true' && !card.closest?.('.series-group');
                    if (absId && !heroHidden && !seen.has(absId)) seen.set(absId, card);
                });
                return Array.from(seen.values());
            }

            function updateFilteredCount() {
                if (!filterCount) return;

                const cards = distinctBookCards();
                const total = cards.length;
                const shown = cards.reduce(
                    (n, card) => n + (card.classList.contains('hidden') ? 0 : 1), 0);
                filterCount.textContent = hasActiveLibraryFilters()
                    ? bbFormat({{ _('{shown} of {total} books')|tojson }}, {shown, total})
                    : '';
            }

            // Narrow the Series and Author lists to what the OTHER filters leave
            // reachable, with a count of distinct books per option.
            //
            // Three deliberate rules:
            //  * A list is never computed from its own selection. Otherwise choosing an
            //    author would leave that author as the only option and you could never
            //    switch without resetting.
            //  * The search box is excluded. It is logically another filter, but feeding
            //    it in would make both lists churn on every keystroke.
            //  * Format is an input to the other two but is never itself narrowed --
            //    it has a handful of fixed options and hiding them reads as breakage.
            function facetOptionBaseLabel(option) {
                if (option.dataset.facetLabel === undefined) {
                    option.dataset.facetLabel = option.textContent.trim();
                }
                return option.dataset.facetLabel;
            }

            function applyFacetCounts(select, cards, matches) {
                if (!select) return;

                Array.from(select.querySelectorAll('option')).forEach(option => {
                    const label = facetOptionBaseLabel(option);
                    if (option.value === 'all') {
                        option.textContent = label;
                        option.hidden = false;
                        option.disabled = false;
                        return;
                    }
                    let count = 0;
                    cards.forEach(card => {
                        if (matches(card, option.value)) count += 1;
                    });
                    option.textContent = label + ' (' + count + ')';
                    // Never hide the current selection: the reader has to be able to
                    // see what they picked and undo it, even once it matches nothing.
                    const keep = count > 0 || option.selected;
                    option.hidden = !keep;
                    option.disabled = !keep;
                });

                // An optgroup whose every option is hidden would still render its label.
                Array.from(select.querySelectorAll('optgroup')).forEach(group => {
                    const usable = Array.from(group.querySelectorAll('option'))
                        .some(option => !option.hidden);
                    group.hidden = !usable;
                });
            }

            function updateFacetOptions() {
                if (!seriesFilter && !authorFilter) return;
                const cards = distinctBookCards();
                applyFacetCounts(seriesFilter, cards.filter(card => passesLibraryFilters(card, 'series')), matchesSeriesFilter);
                applyFacetCounts(authorFilter, cards.filter(card => passesLibraryFilters(card, 'author')), matchesAuthorFilter);
            }

            // Picked values in one filter group; an empty list means All.
            function groupValues(select) {
                return select ? Array.from(select.options)
                    .filter(option => option.selected && option.value !== 'all')
                    .map(option => option.value) : [];
            }

            function setGroupValues(select, values) {
                if (!select) return;
                Array.from(select.options).forEach(option => { option.selected = values.includes(option.value); });
            }

            // Any pick within a group, every group across them.
            function matchesAnyValue(values, entry, matches) {
                return !values.length || values.some(value => matches(entry, value));
            }

            function passesLibraryFilters(card, skipGroup) {
                const matchers = {status: matchesStatusFilter, format: matchesFormatFilter,
                                  author: matchesAuthorFilter, series: matchesSeriesFilter};
                return (!attentionOnlyFilter?.checked || needsAttention(card))
                    && Object.entries(matchers).every(([group, matches]) => group === skipGroup
                        || matchesAnyValue(groupValues(filterGroups[group]), card, matches));
            }

            function hasActiveLibraryFilters() {
                return Object.values(filterGroups).some(select => groupValues(select).length > 0)
                    || !!dashboardSearch?.value.trim()
                    || (attentionOnlyFilter?.checked === true);
            }

            function updateFilterButtonLabel() {
                if (!filterButtonLabel) return;
                const defaultLabel = {{ _('Filter')|tojson }};
                let label = defaultLabel;
                const picked = Object.values(filterGroups).flatMap(select => select
                    ? Array.from(select.options).filter(option => option.selected && option.value !== 'all') : []);
                if (picked.length === 1) label += ' · ' + facetOptionBaseLabel(picked[0]);
                else if (picked.length > 1) label += ' · ' + picked.length;
                filterButtonLabel.textContent = label;
                const active = hasActiveLibraryFilters();
                filterButton?.classList.toggle('is-active', active);
                if (filterResetButton) filterResetButton.hidden = !active;
                if (filterClearButton) filterClearButton.disabled = !active;
            }

            // A click elsewhere keeps focus where the reader clicked (the search box, say).
            function closeFilterPanel(restoreFocus = true) {
                if (!filterPanel || filterPanel.hidden) return;
                filterPanel.hidden = true;
                if (filterBackdrop) filterBackdrop.hidden = true;
                setFilterSheetModal(false);
                filterButton?.setAttribute('aria-expanded', 'false');
                if (restoreFocus) filterButton?.focus();
            }

            // On a phone the panel is a modal bottom sheet: the page around it is inert while it is open
            // (the backdrop stays live, since tapping it closes the sheet).
            let filterSheetInert = [];
            function setFilterSheetModal(open) {
                filterSheetInert.forEach(element => { element.inert = false; });
                filterSheetInert = [];
                if (!open || typeof window === 'undefined' || window.innerWidth > 760) return;
                for (let node = filterPanel; node?.parentElement && node !== document.body; node = node.parentElement) {
                    Array.from(node.parentElement.children).forEach(sibling => {
                        if (sibling === node || sibling === filterBackdrop || sibling.inert) return;
                        sibling.inert = true;
                        filterSheetInert.push(sibling);
                    });
                }
            }

            function positionLibraryFilterPopover() {
                if (!filterPanel || filterPanel.hidden || typeof window === 'undefined' || window.innerWidth <= 760) return;
                filterPanel.style.removeProperty('--library-filter-shift');
                const bounds = filterPanel.getBoundingClientRect();
                const left = Math.max(14, Math.min(bounds.left, window.innerWidth - bounds.width - 14));
                filterPanel.style.setProperty('--library-filter-shift', (left - bounds.left) + 'px');
            }
            if (typeof window !== 'undefined') window.addEventListener('resize', positionLibraryFilterPopover);

            function openFilterPanel() {
                if (!filterPanel) return;
                filterPanel.hidden = false;
                if (filterBackdrop) filterBackdrop.hidden = false;
                setFilterSheetModal(true);
                filterButton?.setAttribute('aria-expanded', 'true');
                positionLibraryFilterPopover();
                filterPanel.querySelector('[data-filter-close]')?.focus();
            }

            function chooseLibraryFilter(group, value) {
                const select = filterGroups[group];
                if (!select) return;
                const picked = groupValues(select);
                setGroupValues(select, value === 'all' ? []
                    : picked.includes(value) ? picked.filter(item => item !== value) : [...picked, value]);
                filterBooks();
                // The option buttons were rebuilt; keep focus on the one just toggled.
                const holder = document.getElementById('filter-' + group + '-options');
                Array.from(holder?.children || []).find(button => button.dataset.value === value)?.focus();
            }

            function renderFilterOptions() {
                if (!filterPanel) return;
                for (const [group, select] of Object.entries(filterGroups)) {
                    if (!select) continue;
                    const holder = document.getElementById('filter-' + group + '-options');
                    if (!holder) continue;
                    const search = document.getElementById('filter-' + group + '-search');
                    const query = (search?.value || '').trim().toLocaleLowerCase();
                    holder.replaceChildren();
                    Array.from(select.options).forEach(option => {
                        if (option.hidden || option.disabled) return;
                        const label = facetOptionBaseLabel(option);
                        if (query && option.value !== 'all' && !label.toLocaleLowerCase().includes(query)) return;
                        const button = document.createElement('button');
                        button.type = 'button';
                        button.className = 'library-filter-option';
                        button.textContent = option.textContent;
                        button.dataset.value = option.value;
                        const pressed = option.value === 'all' ? !groupValues(select).length : option.selected;
                        button.setAttribute('aria-pressed', pressed ? 'true' : 'false');
                        button.addEventListener('click', () => chooseLibraryFilter(group, option.value));
                        holder.appendChild(button);
                    });
                }
            }

            function isValidLibraryFilter(group, value) {
                const select = filterGroups[group];
                return !!select && Array.from(select.options).some(option => option.value === value);
            }

            // Older saves hold one value per group; current ones hold a list.
            function normalizeSavedLibraryFilters(saved, legacyFormat) {
                const list = value => (Array.isArray(value) ? value : [value]).filter(item => item && item !== 'all');
                const candidate = {
                    status: list(saved?.status),
                    format: list(saved?.format || (legacyFormat === 'audiobook' ? 'has_audio' : legacyFormat)),
                    author: list(saved?.author),
                    series: list(saved?.series)
                };
                const attention = !!saved?.attention || candidate.format.includes('needs_attention');
                // "Has Audio" was retired: it is exactly these two formats.
                candidate.format = candidate.format.flatMap(value =>
                    value === 'has_audio' ? ['paired', 'audiobook_only'] : [value]);
                candidate.series = candidate.series.map(value => value === 'standalone' ? 'none' : value);
                for (const group of Object.keys(candidate)) {
                    candidate[group] = [...new Set(candidate[group])]
                        .filter(value => isValidLibraryFilter(group, value));
                }
                return {...candidate, attention};
            }

            if (filterButton) {
                filterButton.addEventListener('click', () => {
                    if (filterPanel?.hidden) openFilterPanel();
                    else closeFilterPanel();
                });
                filterPanel?.querySelector('[data-filter-close]')?.addEventListener('click', () => closeFilterPanel());
                filterResetButton?.addEventListener('click', () => clearLibraryFilters(true));
                filterClearButton?.addEventListener('click', () => {
                    clearLibraryFilters();
                    filterPanel?.querySelector('[data-filter-close]')?.focus();
                });
                filterBackdrop?.addEventListener('click', () => closeFilterPanel());
                document.addEventListener('click', event => {
                    // composedPath, not contains: a toggled option button is rebuilt mid-click.
                    if (filterPanel && !filterPanel.hidden && !event.composedPath().includes(filterHost)) {
                        closeFilterPanel(false);
                    }
                });
                document.addEventListener('keydown', event => {
                    if (event.key === 'Escape' && filterPanel && !filterPanel.hidden) {
                        event.preventDefault();
                        closeFilterPanel();
                    }
                });
                ['author', 'series'].forEach(group => {
                    document.getElementById('filter-' + group + '-search')
                        ?.addEventListener('input', renderFilterOptions);
                });
            }

            function clearLibraryFilters(focusTrigger = false) {
                for (const select of Object.values(filterGroups)) {
                    setGroupValues(select, []);
                }
                if (dashboardSearch) dashboardSearch.value = '';
                if (attentionOnlyFilter) attentionOnlyFilter.checked = false;
                savedAttentionPreference = false;
                for (const group of ['author', 'series']) {
                    const search = document.getElementById('filter-' + group + '-search');
                    if (search) search.value = '';
                }
                filterBooks();
                positionLibraryFilterPopover();
                if (focusTrigger) filterButton?.focus();
            }

            // Offers a route into the Search tab's library search for a title the dashboard
            // filter can't show, because it isn't synced yet.
            function updateSearchHandoff(rawQuery) {
                if (!searchHandoff || !searchHandoffMsg || !searchHandoffLink) return;

                if (!rawQuery) {
                    searchHandoff.classList.add('hidden');
                    return;
                }

                const noResults = !hasVisibleGridItems();
                searchHandoffMsg.textContent = noResults
                    ? bbFormat({{ _('No synced book matches “{query}”.')|tojson }}, { query: rawQuery })
                    : '';
                searchHandoffLink.textContent = bbFormat({{ _('Look for “{query}” in your libraries →')|tojson }}, { query: rawQuery });
                searchHandoffLink.href = addBookSearchUrl + encodeURIComponent(rawQuery);
                searchHandoff.classList.toggle('no-results', noResults);
                searchHandoff.classList.remove('hidden');
            }

            function needsAttention(card) {
                return card.classList.contains('out-of-sync')
                    || ['error', 'failed', 'failed_retry_later', 'failed_permanent'].includes(card.dataset.status);
            }

            function matchesStatusFilter(entry, statusValue) {
                if (!statusValue || statusValue === 'all') return true;
                const rank = readingSortDetails(entry).rank;
                return rank === ({in_progress: 0, not_started: 1, finished: 2})[statusValue];
            }

            function matchesFormatFilter(card, formatValue) {
                if (formatValue === 'all') return true;
                if (formatValue === 'paired') return card.dataset.syncMode === 'audiobook';
                if (formatValue === 'readalong') return card.dataset.readalong === 'true';
                return (card.dataset.syncMode || 'audiobook') === formatValue;
            }

            // 'all', 'none' (no series at all), or 'series:<name>' for one named series.
            // The prefix keeps a series actually called "all" or "none" addressable.
            // A book counts as being in a series whenever the server gave it a name --
            // including the sole owned volume of one, which is rendered as a flat card
            // because single-child groups are demoted server-side.
            const SERIES_FILTER_PREFIX = 'series:';

            function matchesSeriesFilter(card, seriesValue) {
                if (!seriesValue || seriesValue === 'all') return true;
                const seriesName = card.dataset.seriesName || '';
                if (seriesValue === 'none') return !seriesName;
                if (seriesValue.indexOf(SERIES_FILTER_PREFIX) === 0) {
                    return seriesName === seriesValue.slice(SERIES_FILTER_PREFIX.length);
                }
                return true;
            }

            // 'all', 'none' (no author recorded), or 'author:<name>'. Prefixed for the
            // same reason as the series filter: an author actually called "all" stays
            // addressable. A series group card carries its most common author, so
            // selecting an author keeps that author's series intact.
            const AUTHOR_FILTER_PREFIX = 'author:';

            function matchesAuthorFilter(card, authorValue) {
                if (!authorValue || authorValue === 'all') return true;
                const author = card.dataset.author || '';
                if (authorValue === 'none') return !author;
                if (authorValue.indexOf(AUTHOR_FILTER_PREFIX) === 0) {
                    return author === authorValue.slice(AUTHOR_FILTER_PREFIX.length);
                }
                return true;
            }

            function filterBooks() {
                const filterValues = groupValues(filterSelect);
                const statusValues = groupValues(statusFilter);
                const groupedStatus = new Map();
                if (!document.body.classList.contains('series-grouping-off')) {
                    document.querySelectorAll('.series-group').forEach(group => {
                        const matches = matchesAnyValue(statusValues, group, matchesStatusFilter);
                        group.querySelectorAll('.book-card').forEach(card =>
                            groupedStatus.set(card, matches));
                    });
                }
                const seriesValues = groupValues(seriesFilter);
                const authorValues = groupValues(authorFilter);
                const searchString = dashboardSearch ? dashboardSearch.value.toLowerCase() : '';

                // Cards clearing every non-search predicate. A series-name search may stand
                // in for the search term on a group's children, but never for the filters.
                const passesFilters = new Set();

                // Filter flat book cards
                const cards = document.querySelectorAll('.book-card');
                cards.forEach(card => {
                    if (card.dataset.heroExcluded === 'true' && !card.closest?.('.series-group')) {
                        card.classList.add('hidden');
                        card.style.display = 'none';
                        return;
                    }
                    const title = (card.dataset.title || '').toLowerCase();
                    const author = (card.dataset.author || '').toLowerCase();
                    const filename = (card.dataset.filename || '').toLowerCase();
                    const seriesName = (card.dataset.seriesName || '').toLowerCase();

                    let isVisible = (groupedStatus.has(card)
                            ? groupedStatus.get(card) : matchesAnyValue(statusValues, card, matchesStatusFilter))
                        && matchesAnyValue(filterValues, card, matchesFormatFilter)
                        && matchesAnyValue(seriesValues, card, matchesSeriesFilter)
                        && matchesAnyValue(authorValues, card, matchesAuthorFilter)
                        && (!attentionOnlyFilter?.checked || needsAttention(card));
                    if (isVisible) {
                        passesFilters.add(card);
                    }
                    if (isVisible && searchString) {
                        if (!title.includes(searchString) && !author.includes(searchString) && !filename.includes(searchString) && !seriesName.includes(searchString)) {
                            isVisible = false;
                        }
                    }
                    if (isVisible) {
                        card.classList.remove('hidden');
                        card.style.display = '';
                    } else {
                        card.classList.add('hidden');
                        card.style.display = 'none';
                    }
                });

                // Handle series groups: show if any child matches, or series name matches search
                document.querySelectorAll('.series-group').forEach(group => {
                    const seriesName = (group.dataset.seriesName || '').toLowerCase();
                    const seriesAuthor = (group.dataset.author || '').toLowerCase();
                    const seriesNameMatchesSearch = searchString && (seriesName.includes(searchString) || seriesAuthor.includes(searchString));

                    const childCards = group.querySelectorAll('.book-card');
                    let anyChildVisible = false;
                    childCards.forEach(child => {
                        if (seriesNameMatchesSearch && passesFilters.has(child)) {
                            child.classList.remove('hidden');
                            child.style.display = '';
                            anyChildVisible = true;
                        } else if (!child.classList.contains('hidden')) {
                            anyChildVisible = true;
                        }
                    });

                    if (anyChildVisible) {
                        group.classList.remove('hidden');
                        group.style.display = '';
                    } else {
                        group.classList.add('hidden');
                        group.style.display = 'none';
                    }
                });

                updateFacetOptions();
                renderFilterOptions();
                updateFilterButtonLabel();
                updateFilteredCount();
                updateSearchHandoff(dashboardSearch ? dashboardSearch.value.trim() : '');

                // The first grouping pass must not overwrite saved filters before restore.
                if (filterInitialized) {
                    try {
                        // Lists live under their own key; Classic keeps reading one value from abs_kosync_filters.
                        localStorage.setItem('abs_kosync_library_filters', JSON.stringify({
                            format: filterValues,
                            series: seriesValues,
                            author: authorValues,
                            attention: attentionOnlyFilter ? attentionOnlyFilter.checked : savedAttentionPreference,
                            status: statusValues
                        }));
                    } catch (e) {
                        console.debug('LocalStorage error:', e);
                    }
                }
            }

            window.toggleSeries = function (domId) {
                const group = document.getElementById(domId);
                if (!group) return;
                const expanded = group.classList.toggle('expanded');
                const header = group.querySelector('.series-header');
                if (header) header.setAttribute('aria-expanded', expanded ? 'true' : 'false');
                try {
                    if (expanded) {
                        localStorage.setItem('series_expanded_' + domId, '1');
                    } else {
                        localStorage.removeItem('series_expanded_' + domId);
                    }
                } catch (e) { /* ignore */ }
            };

            // Initial Sort Defaults
            let sortState = {
                title: 'asc',      // A-Z default
                author: 'asc',     // A-Z default
                series: 'asc',     // Series A-Z, then reading order
                progress: 'desc',  // Highest progress first
                reading: 'asc', // In progress, Not started, Finished; newest sync first
                last_sync: 'desc', // Newest sync first
                added: 'desc',     // Newest addition first
                rating: 'desc'     // Highest rating first
            };

            // Track last sort to detect toggles.
            // Important: Start as null to prevent auto-toggling on page load
            let lastSort = null;

            // Load saved preferences
            let savedSort = 'reading';
            try { savedSort = localStorage.getItem('abs_kosync_sort') || 'reading'; } catch (e) { /* storage unavailable */ }
            if (savedSort === 'status' || !Object.prototype.hasOwnProperty.call(sortState, savedSort)) savedSort = 'reading';
            let savedSortState;
            try { savedSortState = localStorage.getItem('abs_kosync_sort_state'); } catch (e) { /* storage unavailable */ }

            if (savedSort && sortSelect) {
                sortSelect.value = savedSort;
            }

            if (savedSortState) {
                try {
                    // Merge saved state with defaults
                    const storedDirections = JSON.parse(savedSortState);
                    if (storedDirections.status && !storedDirections.reading) {
                        storedDirections.reading = storedDirections.status;
                    }
                    delete storedDirections.status;
                    sortState = { ...sortState, ...storedDirections };
                } catch (e) {
                    console.error("Error parsing saved sort state", e);
                }
            }

            // Parse "Time Ago" or unix timestamp for sorting (smaller = more recent)
            function parseLastSync(syncText) {
                if (!syncText || syncText === 'Never' || syncText === 'Error') return Infinity;
                // Handle raw unix timestamps from series groups
                const asNum = parseFloat(syncText);
                if (!isNaN(asNum) && asNum > 1e9) {
                    return Math.max(0, Date.now() / 1000 - asNum);
                }
                const match = syncText.match(/(\d+)([smhd])/);
                if (!match) return Infinity;
                const value = parseInt(match[1]);
                const unit = match[2];
                if (unit === 's') return value;
                if (unit === 'm') return value * 60;
                if (unit === 'h') return value * 3600;
                if (unit === 'd') return value * 86400;
                return Infinity;
            }

            // Returns age in seconds for sorting (smaller = more recent).
            // Prefers data-last-sync-unix; falls back to parseLastSync on data-last-sync.
            function getLastSyncAge(el) {
                const unixStr = el.dataset.lastSyncUnix;
                if (unixStr !== undefined && unixStr !== '') {
                    const unixVal = parseFloat(unixStr);
                    if (!isNaN(unixVal) && unixVal > 0) {
                        return Math.max(0, Date.now() / 1000 - unixVal);
                    }
                }
                // Fallback: never-synced (0 or missing) or unparseable -> parse humanized string
                return parseLastSync(el.dataset.lastSync || '');
            }

            // Title value used by the tie-breaks. A series group card carries its series
            // name rather than a title, so it still compares against book cards.
            function sortTitleOf(el) {
                return (el.dataset.title || el.dataset.seriesName || '').toLowerCase();
            }

            function readingSortDetails(el) {
                const cards = el.classList.contains('series-group')
                    ? Array.from(el.querySelectorAll('.book-card')) : [el];
                const members = cards.length ? cards : [el];
                const rank = Math.min(...members.map(card => {
                    const progress = parseFloat(card.dataset.progress || '0') || 0;
                    if (progress > 0 && progress < 100) return 0;
                    return progress >= 100 ? 2 : 1;
                }));
                return {
                    rank,
                    syncAge: Math.min(getLastSyncAge(el), ...members.map(getLastSyncAge))
                };
            }

            // Returns the comparator for one sort key so both sortCards and the author
            // view order entries identically.
            function makeSortComparator(sortBy, direction) {
                return (a, b) => {
                    let comparison = 0;
                    let valA, valB;
                    if (sortBy === 'reading') {
                        const statusA = readingSortDetails(a);
                        const statusB = readingSortDetails(b);
                        comparison = statusA.rank - statusB.rank;
                        if (comparison === 0 && statusA.syncAge !== statusB.syncAge) {
                            comparison = statusA.syncAge < statusB.syncAge ? -1 : 1;
                        }
                        if (comparison === 0) comparison = sortTitleOf(a).localeCompare(sortTitleOf(b));
                    } else if (sortBy === 'last_sync') {
                        comparison = getLastSyncAge(a) - getLastSyncAge(b);
                    } else if (sortBy === 'title') {
                        valA = (a.dataset.title || a.dataset.seriesName || '').toLowerCase();
                        valB = (b.dataset.title || b.dataset.seriesName || '').toLowerCase();
                        comparison = valA.localeCompare(valB);
                    } else if (sortBy === 'author') {
                        const authorA = (a.dataset.author || '').toLowerCase();
                        const authorB = (b.dataset.author || '').toLowerCase();
                        // Unattributed books trail the named ones either way, like the
                        // unrated branch below.
                        if (!authorA && authorB) return 1;
                        if (authorA && !authorB) return -1;
                        comparison = authorA.localeCompare(authorB);
                        if (comparison === 0) {
                            // Returned directly, like the added branch: one author's books
                            // read A-Z whichever way the author column is pointing.
                            return sortTitleOf(a).localeCompare(sortTitleOf(b));
                        }
                    } else if (sortBy === 'series') {
                        const seriesA = (a.dataset.seriesName || '').toLowerCase();
                        const seriesB = (b.dataset.seriesName || '').toLowerCase();
                        // Standalone books trail every series either way.
                        if (!seriesA && seriesB) return 1;
                        if (seriesA && !seriesB) return -1;
                        comparison = seriesA.localeCompare(seriesB);
                        if (comparison === 0) {
                            // Within one series, reading order stays ascending whichever way
                            // the series column points. Sequence 0 is valid, so test for a
                            // finite number rather than truthiness; a series group card has
                            // no sequence and trails its own volumes.
                            const seqA = parseFloat(a.dataset.seriesSequence);
                            const seqB = parseFloat(b.dataset.seriesSequence);
                            const hasSeqA = Number.isFinite(seqA);
                            const hasSeqB = Number.isFinite(seqB);
                            if (hasSeqA && hasSeqB && seqA !== seqB) return seqA - seqB;
                            if (hasSeqA && !hasSeqB) return -1;
                            if (!hasSeqA && hasSeqB) return 1;
                            return sortTitleOf(a).localeCompare(sortTitleOf(b));
                        }
                    } else if (sortBy === 'progress') {
                        valA = parseFloat(a.dataset.progress || '0') || 0;
                        valB = parseFloat(b.dataset.progress || '0') || 0;
                        comparison = valA - valB;
                    } else if (sortBy === 'added') {
                        // Books claimed before the multi-user migration share its
                        // backfill stamp, so they tie; localeCompare on title breaks
                        // the tie into a stable order instead of a random one.
                        valA = parseFloat(a.dataset.added || '0') || 0;
                        valB = parseFloat(b.dataset.added || '0') || 0;
                        comparison = valA - valB;
                        if (comparison === 0) {
                            const titleA = (a.dataset.title || a.dataset.seriesName || '').toLowerCase();
                            const titleB = (b.dataset.title || b.dataset.seriesName || '').toLowerCase();
                            // Returned directly, like the rating branch below: the tie
                            // block reads A-Z whichever way the date is pointing.
                            return titleA.localeCompare(titleB);
                        }
                    } else if (sortBy === 'rating') {
                        const rawA = a.dataset.rating;
                        const rawB = b.dataset.rating;
                        const hasA = rawA !== undefined && rawA !== '';
                        const hasB = rawB !== undefined && rawB !== '';
                        if (!hasA && !hasB) return 0;
                        if (!hasA) return 1;   // unrated always last
                        if (!hasB) return -1;  // unrated always last
                        valA = parseFloat(rawA);
                        valB = parseFloat(rawB);
                        comparison = valA - valB;
                    }

                    return direction === 'asc' ? comparison : -comparison;
                };
            }

            function sortCards(grid, sortBy, direction) {
                if (!grid) return;
                const items = Array.from(grid.children);
                const sorted = items.sort(makeSortComparator(sortBy, direction));

                sorted.forEach(el => grid.appendChild(el));
            }

            function sortBooks(sortBy, direction) {
                sortCards(libraryGrid, sortBy, direction);
            }

            function applySorting(sortBy) {
                let direction;

                // Check if we are selecting the same sort type to toggle direction
                if (lastSort === sortBy) {
                    const currentDirection = sortState[sortBy];
                    direction = currentDirection === 'asc' ? 'desc' : 'asc';
                    sortState[sortBy] = direction;
                } else {
                    // Different selection (or first load) -> Use stored direction
                    direction = sortState[sortBy];
                }

                // Update tracker
                lastSort = sortBy;

                // Update UI Arrow
                updateSortIndicator(direction);

                // Sort Grids
                sortBooks(sortBy, direction);

                // Save preferences
                try {
                    localStorage.setItem('abs_kosync_sort', sortBy);
                    localStorage.setItem('abs_kosync_sort_state', JSON.stringify(sortState));
                } catch (e) { /* storage unavailable */ }
            }

            function updateSortIndicator(direction) {
                if (directionBtn) {
                    directionBtn.textContent = direction === 'asc' ? '↑' : '↓';
                }
            }

            // --- Series Grouping Toggle ---

            // Tag every book card that lives inside a series-children container so we can
            // restore it to its original position when grouping is turned back on.
            document.querySelectorAll('.series-children').forEach(container => {
                if (!container.id) return;
                Array.from(container.children).forEach((card, idx) => {
                    if (!card.classList || !card.classList.contains('book-card')) return;
                    card.dataset.seriesContainerId = container.id;
                    card.dataset.seriesOrder = String(idx);
                });
            });

            // The single-card series design (issue #449) renders the lead book as a
            // full .book-card directly inside .series-group, a sibling of
            // .series-children rather than a child of it -- it needs the same tag-and-restore
            // treatment. Its "container" is the series-group itself, and restore
            // must put it back in front of .series-children rather than appending.
            document.querySelectorAll('.series-group').forEach(group => {
                if (!group.id) return;
                const leadCard = group.querySelector(':scope > .book-card');
                if (!leadCard) return;
                leadCard.dataset.seriesContainerId = group.id;
                leadCard.dataset.seriesLead = '1';
            });

            function flattenSeriesGroups() {
                if (!libraryGrid) return;
                document.querySelectorAll('.series-group .book-card').forEach(card => {
                    libraryGrid.appendChild(card);
                });
            }

            function restoreSeriesGroups() {
                // Reparent any card that was moved out of its series-children -- or,
                // for a lead card, out of its series-group. A lead card must land
                // back in front of .series-children, not after it.
                document.querySelectorAll('.book-card[data-series-container-id]').forEach(card => {
                    const container = document.getElementById(card.dataset.seriesContainerId);
                    if (!container || card.parentNode === container) return;
                    if (card.dataset.seriesLead === '1') {
                        container.insertBefore(card, container.firstChild);
                    } else {
                        container.appendChild(card);
                    }
                });
                // Restore original sibling order within each series-children container.
                document.querySelectorAll('.series-children').forEach(container => {
                    const items = Array.from(container.children).filter(el => el.classList && el.classList.contains('book-card'));
                    items.sort((a, b) => (parseInt(a.dataset.seriesOrder || '0', 10) - parseInt(b.dataset.seriesOrder || '0', 10)));
                    items.forEach(el => container.appendChild(el));
                });
            }

            function applySeriesGrouping(enabled) {
                document.body.classList.toggle('series-grouping-off', !enabled);
                if (enabled) restoreSeriesGroups();
                else flattenSeriesGroups();

                if (sortSelect) sortBooks(sortSelect.value, sortState[sortSelect.value]);
                if (typeof filterBooks === 'function') filterBooks();
                if (typeof window.bookbridgeSyncPreviewLayout === 'function') {
                    window.bookbridgeSyncPreviewLayout();
                }
            }

            // --- Event Listeners ---

            if (sortSelect) {
                sortSelect.addEventListener('change', (e) => {
                    applySorting(e.target.value);
                });
            }

            if (seriesGroupingToggle) {
                seriesGroupingToggle.addEventListener('change', (e) => {
                    const enabled = e.target.checked;
                    try { localStorage.setItem('abs_kosync_series_grouping', enabled ? '1' : '0'); } catch (err) { /* ignore */ }
                    applySeriesGrouping(enabled);
                });
            }

            // Clickable arrow behavior
            if (directionBtn) {
                directionBtn.addEventListener('click', () => {
                    // Clicking the arrow re-applies the CURRENT sort value.
                    // Since 'lastSort' will match, this triggers the toggle logic in applySorting.
                    applySorting(sortSelect.value);
                });
            }

            document.addEventListener('DOMContentLoaded', () => {
                // Restore per-series expansion state
                document.querySelectorAll('.series-group').forEach(function (group) {
                    try {
                        if (localStorage.getItem('series_expanded_' + group.id) === '1') {
                            group.classList.add('expanded');
                            const header = group.querySelector('.series-header');
                            if (header) header.setAttribute('aria-expanded', 'true');
                        }
                    } catch (e) { /* ignore */ }
                });
            });

            // --- Initialization ---

            // Apply initial sort on load (if content exists)
            if (libraryGrid) {
                applySorting(savedSort);
            }

            // Restore series-grouping preference (default ON).
            if (seriesGroupingToggle) {
                let savedGrouping = '1';
                try {
                    const v = localStorage.getItem('abs_kosync_series_grouping');
                    if (v === '0' || v === '1') savedGrouping = v;
                } catch (e) { /* ignore */ }
                const enabled = savedGrouping === '1';
                seriesGroupingToggle.checked = enabled;
                if (!enabled) applySeriesGrouping(false);
            }

            // The hidden multi-selects are the canonical filter state.
            if (filterSelect) {
                if (attentionOnlyFilter) attentionOnlyFilter.addEventListener('change', () => {
                    savedAttentionPreference = attentionOnlyFilter.checked;
                    filterBooks();
                });

                let savedFilters = null;
                let legacyFormat = null;
                try {
                    const raw = localStorage.getItem('abs_kosync_library_filters')
                        || localStorage.getItem('abs_kosync_filters');
                    if (raw) savedFilters = JSON.parse(raw);
                    else legacyFormat = localStorage.getItem('abs_kosync_filter');
                } catch (e) {
                    console.debug('LocalStorage error:', e);
                }
                const restored = normalizeSavedLibraryFilters(savedFilters, legacyFormat);
                for (const [group, select] of Object.entries(filterGroups)) {
                    setGroupValues(select, restored[group]);
                }
                savedAttentionPreference = restored.attention;
                if (attentionOnlyFilter) attentionOnlyFilter.checked = restored.attention;
                filterInitialized = true;
                filterBooks();
            }

            if (dashboardSearch) {
                dashboardSearch.addEventListener('input', filterBooks);
            }

            const heroRoot = document.getElementById('library-hero');

            // Optional pieces load after first paint and never take part in the dashboard build.
            const heroOrder = ['synopsis', 'stats', 'streak'];
            const heroChosen = heroOrder.filter(key =>
                (heroRoot?.dataset.heroContent || '').split(',').includes(key));
            const heroServiceNames = {
                abs: 'Audiobookshelf', absebook: 'Audiobookshelf',
                bookorbit: 'BookOrbit', bookorbitaudio: 'BookOrbit',
                booklore: 'Grimmory', bookloreaudio: 'Grimmory',
                kavita: 'Kavita', cwa: 'Calibre-Web', bookfusion: 'BookFusion',
                kosync: 'KOReader', storyteller: 'Storyteller'
            };
            const heroSlotOrder = ['audio', 'ebook', 'koreader', 'readalong'];
            const heroSlotLabels = {
                audio: {{ _('Audio')|tojson }}, ebook: {{ _('Ebook')|tojson }},
                koreader: 'KOReader', readalong: {{ _('Read-along')|tojson }}
            };
            let heroSlots = [];
            try { heroSlots = JSON.parse(heroRoot?.dataset.heroSlots || '[]'); } catch (_) { /* no slots */ }
            let heroPieces = {};
            let heroSequence = 0;
            let heroController = null;

            function heroTime(seconds) {
                const minutes = Math.max(0, Math.round(Number(seconds || 0) / 60));
                const hours = Math.floor(minutes / 60);
                return hours ? hours + 'h ' + (minutes % 60) + 'm' : minutes + 'm';
            }

            function heroAgo(unix) {
                if (!(Number(unix) > 0)) return '';
                const seconds = Math.max(0, Date.now() / 1000 - Number(unix));
                if (seconds < 60) return {{ _('just now')|tojson }};
                if (seconds < 3600) return bbFormat({{ _('{n}m ago')|tojson }}, {n: Math.floor(seconds / 60)});
                if (seconds < 86400) return bbFormat({{ _('{n}h ago')|tojson }}, {n: Math.floor(seconds / 3600)});
                return bbFormat({{ _('{n}d ago')|tojson }}, {n: Math.floor(seconds / 86400)});
            }

            function heroSlotRows(row, card) {
                const states = row.states || {};
                const groups = [
                    ['audio', ['abs', 'bookorbitaudio', 'bookloreaudio']],
                    ['ebook', ['bookorbit', 'booklore', 'kavita', 'cwa', 'bookfusion', 'absebook']],
                    ['koreader', ['kosync']],
                    ['readalong', ['storyteller']]
                ];
                return groups.map(([key, clients]) => {
                    const candidate = clients.map(name => [name, states[name]])
                        .filter(([, state]) => state && state.percentage != null)
                        .sort((a, b) => Number(b[1].last_updated || 0) - Number(a[1].last_updated || 0))[0];
                    const slotNode = card?.querySelector('.format-slot[data-slot="' + key + '"]');
                    return {
                        key, linked: slotNode ? !slotNode.classList.contains('is-faint') : !!candidate,
                        service: candidate ? heroServiceNames[candidate[0]] : null,
                        pct: candidate ? Number(candidate[1].percentage) : null,
                        last: key === row.last_slot
                    };
                });
            }

            function heroElement(tag, className, value) {
                const element = document.createElement(tag);
                if (className) element.className = className;
                if (value != null) element.textContent = String(value);
                return element;
            }

            function heroClamp(pct) {
                return Math.max(0, Math.min(100, Number(pct) || 0));
            }

            function heroKnownSlots() {
                return heroSlots.filter(slot => slot.linked !== false && slot.pct != null &&
                    Number.isFinite(Number(slot.pct)))
                    .sort((a, b) => heroSlotOrder.indexOf(a.key) - heroSlotOrder.indexOf(b.key));
            }

            function heroLeaderSlot(known) {
                return known.find(slot => slot.last) ||
                    known.find(slot => slot.key === heroRoot?.dataset.leaderSlot) || null;
            }

            // Time left for audio, else pages left from the reading position.
            function heroLeft(known) {
                const audio = known.find(slot => slot.key === 'audio');
                const duration = Number(heroRoot?.dataset.duration || 0);
                if (audio && duration > 0) {
                    const amount = duration * (1 - heroClamp(audio.pct) / 100);
                    return {amount, unit: 'seconds', text: bbFormat({{ _('{left} left')|tojson }}, {left: heroTime(amount)})};
                }
                const reading = known.find(slot => slot.key === 'koreader') || known.find(slot => slot.key === 'ebook');
                const pages = Number(heroRoot?.dataset.pages || 0);
                if (reading && pages > 0) {
                    const amount = Math.round(pages * (1 - heroClamp(reading.pct) / 100));
                    return {amount, unit: 'pages', text: bbFormat({{ _('{pages} pages left')|tojson }}, {pages: amount})};
                }
                return null;
            }

            // A finish date only from this week's own pace, never a guess.
            function heroFinish(left) {
                const piece = left.unit === 'seconds' ? heroPieces.listened : heroPieces.pages;
                const week = Number(piece?.week || 0);
                if (!(week > 0) || !(left.amount > 0)) return '';
                const today = new Date();
                const daysThisWeek = ((today.getDay() + 6) % 7) + 1;
                const days = Math.ceil(left.amount / (week / daysThisWeek));
                if (!Number.isFinite(days) || days > 365) return '';
                const finish = new Date(today.getFullYear(), today.getMonth(), today.getDate() + days);
                return bbFormat({{ _('done ~{date}')|tojson }}, {
                    date: finish.toLocaleDateString(undefined, {month: 'short', day: 'numeric'})
                });
            }

            function paintHeroBase() {
                if (!heroRoot || heroRoot.hidden) return;
                const known = heroKnownSlots();
                const leader = heroLeaderSlot(known);
                const moved = heroRoot.querySelector('.hero-moved');
                if (moved) {
                    const service = heroRoot.dataset.service || '';
                    const listening = (leader?.key || heroRoot.dataset.leaderSlot) === 'audio';
                    const where = !service ? {{ _('Currently reading')|tojson }} : bbFormat(listening
                        ? {{ _('Listening on {service}')|tojson }} : {{ _('Reading on {service}')|tojson }}, {service});
                    const ago = heroAgo(heroRoot.dataset.movementAt);
                    moved.textContent = ago ? where + ' · ' + ago : where;
                }
                const leftNode = heroRoot.querySelector('.hero-left');
                if (leftNode) {
                    const left = heroLeft(known);
                    leftNode.textContent = left ? [left.text, heroFinish(left)].filter(Boolean).join(' · ') : '';
                    leftNode.hidden = !left;
                }
                const track = heroRoot.querySelector('.hero-track');
                const fill = track?.querySelector('.hero-track-fill');
                if (!fill) return;
                track.dataset.leader = leader?.key || '';
                fill.style.width = heroClamp(heroRoot.dataset.percent) + '%';
                track.replaceChildren(fill, ...known.filter(slot => slot !== leader).map(slot => {
                    const mark = heroElement('span', 'hero-track-mark');
                    mark.dataset.slot = slot.key;
                    mark.style.left = heroClamp(slot.pct) + '%';
                    return mark;
                }));
                const legend = heroRoot.querySelector('.hero-legend');
                if (!legend) return;
                legend.replaceChildren(...known.map(slot => {
                    const item = heroElement('span', 'hero-legend-item');
                    item.dataset.slot = slot.key;
                    if (slot.service) item.title = slot.service;
                    item.append(heroElement('span', 'hero-legend-swatch'),
                        heroElement('span', '', heroSlotLabels[slot.key] + ' ' + Math.floor(Number(slot.pct)) + '%'));
                    return item;
                }));
                legend.hidden = known.length < 2;
            }

            function heroSetRating(value) {
                const rating = parseFloat(value);
                const known = Number.isFinite(rating);
                const stars = heroRoot?.querySelector('.hero-rating');
                if (stars) {
                    stars.hidden = !known;
                    if (known) stars.setAttribute('aria-label', bbFormat({{ _('Rated {rating} of 5')|tojson }}, {rating: rating.toFixed(1)}));
                    stars.querySelector('.hero-stars')?.style.setProperty('--hero-stars', (known ? rating * 20 : 0) + '%');
                    const number = stars.querySelector('.hero-rating-value');
                    if (number) number.textContent = known ? rating.toFixed(1) : '';
                }
                const phone = heroRoot?.querySelector('.hero-phone-rating');
                if (phone) {
                    phone.hidden = !known;
                    phone.textContent = known ? '★ ' + rating.toFixed(1) : '';
                }
            }

            // Square audiobook art sits whole on a blurred copy of itself instead of being cropped.
            function heroFitCover() {
                const cover = heroRoot?.querySelector('.hero-cover');
                if (!cover?.querySelector) return;
                cover.querySelector('.hero-cover-backdrop')?.remove();
                cover.classList.remove('is-square');
                const image = cover.querySelector('.cover-image');
                const page = document.getElementById('library-page');
                if (page?.dataset.background === 'cover' && !image) page.style.removeProperty('--library-wallpaper');
                if (page?.dataset.background === 'cover' && image) {
                    // Follow the hero to a new book; the server rendered the first one.
                    const wallpaper = () => {
                        const src = image.isConnected && !image.hidden && image.naturalWidth && (image.currentSrc || image.src);
                        if (src) page.style.setProperty('--library-wallpaper', 'url(' + JSON.stringify(src) + ')');
                    };
                    image.addEventListener('load', wallpaper, {once: true});
                    if (image.complete) wallpaper();
                }
                if (!image) return;
                const fit = () => {
                    if (!image.isConnected || !image.naturalWidth || cover.querySelector('.hero-cover-backdrop')) return;
                    if (image.naturalWidth / image.naturalHeight < 0.85) return;
                    const backdrop = image.cloneNode(false);
                    backdrop.className = 'hero-cover-backdrop';
                    backdrop.removeAttribute('onerror');
                    backdrop.removeAttribute('data-thumb-url');
                    backdrop.hidden = false;
                    backdrop.setAttribute('aria-hidden', 'true');
                    cover.classList.add('is-square');
                    cover.prepend(backdrop);
                };
                image.addEventListener('load', fit);
                if (image.complete) fit();
            }

            function heroStat(key, label, value, unit, meta) {
                const group = heroElement('div', 'hero-stat hero-stat-' + key);
                group.append(heroElement('span', 'hero-stat-label', label));
                const number = heroElement('strong', 'hero-stat-value', value);
                if (unit) number.append(heroElement('span', 'hero-stat-unit', ' ' + unit));
                group.append(number);
                meta.forEach(line => group.append(heroElement('span', 'hero-stat-meta', line)));
                return group;
            }

            function renderHeroPieces() {
                if (!heroRoot || heroRoot.hidden) return;
                const synopsis = heroRoot.querySelector('.hero-synopsis');
                if (synopsis) {
                    const text = heroChosen.includes('synopsis') ? heroPieces.synopsis?.text : '';
                    synopsis.textContent = text || '';
                    synopsis.hidden = !text;
                }
                const stats = heroRoot.querySelector('.hero-stats');
                if (stats) {
                    const groups = [];
                    const listened = heroChosen.includes('stats') ? heroPieces.listened : null;

    /* Spine colours: [main, band, ink] from a cover image, or null when it can't be read. */
    function spineColours(img) {
        const canvas = document.createElement('canvas');
        canvas.width = 12;
        canvas.height = 18;
        const context = canvas.getContext('2d', { willReadFrequently: true });
        let data;
        try {
            context.drawImage(img, 0, 0, 12, 18);
            data = context.getImageData(0, 0, 12, 18).data;
        } catch (e) { return null; }
        const buckets = new Map();
        for (let i = 0; i < data.length; i += 4) {
            const r = data[i], g = data[i + 1], b = data[i + 2];
            const key = (r >> 5) << 6 | (g >> 5) << 3 | (b >> 5);
            const bucket = buckets.get(key) || { n: 0, weight: 0, r: 0, g: 0, b: 0 };
            // Near-black and near-white count for little, so a dark or pale cover shows its colour; an all-black cover stays black.
            const max = Math.max(r, g, b), min = Math.min(r, g, b);
            bucket.weight += max < 40 || min > 220 ? 0.15 : 1 + 4 * (max - min) / max;
            bucket.n += 1; bucket.r += r; bucket.g += g; bucket.b += b;
            buckets.set(key, bucket);
        }
        const ranked = [...buckets.values()].sort((a, b) => b.weight - a.weight);
        if (!ranked.length) return null;
        const mean = bucket => [bucket.r, bucket.g, bucket.b].map(total => Math.round(total / bucket.n));

    } catch (e) { /* Private browsing may block storage. */ }
    function reloadAfterSelectionAction() {
        try { sessionStorage.setItem('bb-library-after-bulk', document.getElementById('selection-count').textContent); } catch (e) { /* Storage may be unavailable. */ }
        location.reload();
    }
    let libraryBatchRunning = false;
    async function runSelectedBooks(label, action) {
        if (libraryBatchRunning) return;
        const ids = selectedBookIds();
        if (!ids.length) return;
        libraryBatchRunning = true;
        const count = document.getElementById('selection-count');
        const controls = Array.from(document.querySelectorAll('#selection-bar button, [data-select-book], .library-toolbar button'));
        controls.forEach(button => { button.disabled = true; });
        document.getElementById('selection-bar').setAttribute('aria-busy', 'true');
        const failed = [];
        for (let i = 0; i < ids.length; i++) {
            count.textContent = bbFormat({{ _('{label} {current} of {total}')|tojson }}, {label, current: i + 1, total: ids.length});
            try { await action(ids[i]); } catch (error) { failed.push(ids[i]); console.error('Library action failed', error); }
        }
        controls.forEach(button => { button.disabled = false; });
        libraryBatchRunning = false;
        document.getElementById('selection-bar').removeAttribute('aria-busy');
        document.querySelectorAll('[data-select-book]').forEach(input => { if (!failed.includes(input.value)) input.checked = false; });
        updateSelectionBar();
        if (!failed.length) {
            document.getElementById('selection-bar').hidden = false;
            count.textContent = bbFormat({{ _('{count} completed')|tojson }}, {count: ids.length});
        }
        if (failed.length) count.textContent = bbFormat({{ _('{success} completed; {failed} failed. Failed books remain selected.')|tojson }}, {success: ids.length - failed.length, failed: failed.length});
        window.bbForgePoll?.kick();
        return {failed, total: ids.length};
    }
    window.bulkSyncNow = function () { return runSelectedBooks({{ _('Syncing')|tojson }}, async id => {
        const response = await fetch('/api/sync-now/' + encodeURIComponent(id), {method:'POST', headers:{'Content-Type':'application/json'}});
        const data = await response.json();
        if (!response.ok || !data.success) throw new Error(data.error || {{ _('Sync request failed')|tojson }});
    }); };
    window.bulkMarkFinished = function () {
        if (libraryBatchRunning) return;
        const ids = selectedBookIds();
        if (!ids.length || !confirm(bbFormat({{ _('Mark {count} selected books finished on all synced platforms?')|tojson }}, {count: ids.length}))) return;
        return runSelectedBooks({{ _('Finishing')|tojson }}, async id => {
            const response = await fetch('/api/mark-complete/' + encodeURIComponent(id), {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({delete:false})});
            const data = await response.json();
            if (!response.ok || !data.success) throw new Error(data.error || {{ _('Could not mark finished')|tojson }});
        }).then(result => { if (!result.failed.length) reloadAfterSelectionAction(); });
    };
    window.bulkGenerateReadalong = function () { return runSelectedBooks({{ _('Creating')|tojson }}, async id => {
        const response = await fetch('/api/readalong-epub/' + encodeURIComponent(id), {method:'POST', headers:{'Content-Type':'application/json'}});
        const data = await response.json();
        if (!response.ok || !data.success) throw new Error(data.error || {{ _('Could not create read-along EPUB')|tojson }});
        const card = Array.from(document.querySelectorAll('.book-card')).find(card => card.dataset.absId === id);
        const status = card?.querySelector('.readalong-status');
        if (status) { status.hidden = false; setTimeout(() => _pollReadalongEpubStatus(id, status, ''), 5000); }
    }); };
    window.bulkDeleteBooks = function () {
        if (libraryBatchRunning) return;
        const ids = selectedBookIds();
        if (!ids.length || !confirm(bbFormat({{ _('Remove {count} selected books from your library?')|tojson }}, {count: ids.length}))) return;
        return runSelectedBooks({{ _('Removing')|tojson }}, async id => {
            const response = await fetch('/delete/' + encodeURIComponent(id), {method:'POST', redirect:'follow'});
            if (!response.ok || /\/login(?:\?|$)/.test(response.url)) throw new Error({{ _('Could not remove this book')|tojson }});
        }).then(result => { if (!result.failed.length) reloadAfterSelectionAction(); });
    };
</script>

{% endif %}
