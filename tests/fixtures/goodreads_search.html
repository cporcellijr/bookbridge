<!doctype html>
<html>
<body>
  <div class="SearchTabContent__region" role="group" aria-label="Search results">
    <ul role="list">
      <li>
        <div class="Book" data-testid="book-item-kca://book/amzn1.gr.book.v3.EXAMPLE">
          <div class="Book__cover" aria-hidden="true">
            <div class="BookCard" data-testid="book-card">
              <div class="BookCard__clickCardTarget BookCard__interactive BookCard__block">
                <a href="/book/show/123456?ref=s_s" class="BookCard__stretchedLink"
                   aria-label="Example Book"></a>
                <div class="BookCard__cover"><div class="BookCover"><div class="BookCover__image">
                  <img data-testid="responsive-image" class="ResponsiveImage"
                       src="https://example.test/cover.jpg" alt="Example Book Book Cover">
                </div></div></div>
              </div>
            </div>
          </div>
          <div class="Book__details"><div class="Book__content" data-testid="book-item-content">
            <span class="Text Text__title3" data-testid="book-item-title">
              <a href="/book/show/123456">Example Book</a>
            </span>
            <span class="BookAuthors BookAuthors--inline" data-testid="book-item-contributors">
              <a class="ContributorLink" href="/author/show/789.Example_Author">
                <span class="ContributorLink__name" data-testid="name">Example Author</span>
              </a>
            </span>
          </div></div>
        </div>
      </li>
    </ul>
  </div>
</body>
</html>
