site_name: BookBridge
site_url: https://cporcellijr.github.io/bookbridge/
site_author: cporcellijr
site_description: Open-source, self-hosted Whispersync alternative. Sync audiobook and ebook progress across Audiobookshelf, KOReader, Storyteller, BookOrbit and more.

# Developer plans and handoff notes stay in the repo but off the public site.
exclude_docs: |
  /ARCHITECTURE_*.md
  /OPTION_C_*.md
  /PLAN_*.md
  /PROMPT_*.md
  /SLICE*.md
  /epub-cover-memory-fix.md
  /issue-*.md
  /suggestions-redesign-backend-handoff.md
  /test-suite-performance.md
  /automated-review/
  /omni-bridge.md
  /security/
  /triage/

repo_name: cporcellijr/bookbridge
repo_url: https://github.com/cporcellijr/bookbridge

theme:
  name: material
  custom_dir: overrides
  logo: assets/icon-192.png
  favicon: assets/icon-192.png
  # Fonts are bundled (the app's own Literata, Instrument Sans, IBM Plex Mono); no Google Fonts requests.
  font: false
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode

extra_css:
  - assets/fonts/fonts.css
  - stylesheets/extra.css

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: index.md
  - Getting Started:
      - Install and first sync: getting-started.md
      - Settings Tour: settings-tour.md
      - How It Works: how-it-works.md
      - Supported Apps: supported-apps.md
  - Connect Your Apps:
      - Overview: apps/index.md
      - Listen and read:
          - Audiobookshelf: apps/audiobookshelf.md
          - BookOrbit: apps/bookorbit.md
          - Grimmory: apps/grimmory.md
          - Storyteller: apps/storyteller.md
      - Readers:
          - KOReader: apps/koreader.md
          - Kavita: apps/kavita.md
          - Calibre-Web Automated: apps/calibre-web-automated.md
          - BookFusion: apps/bookfusion.md
          - Readest: apps/readest.md
      - Trackers:
          - Hardcover: apps/hardcover.md
          - StoryGraph: apps/storygraph.md
          - Goodreads: apps/goodreads.md
      - Getting books:
          - Shelfmark: apps/shelfmark.md
  - User Guide:
      - User Guide: user-guide.md
      - New Interface (Beta): new-interface.md
  - Reference:
      - Configuration: configuration.md
      - Device API: device-api.md
      - Backup & Restore: backup-restore.md
  - Troubleshooting: troubleshooting.md
  - Changelog: changelog.md
