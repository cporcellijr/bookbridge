site_name: BookBridge
site_url: https://cporcellijr.github.io/bookbridge/
site_author: cporcellijr
site_description: Open-source, self-hosted Whispersync alternative. Sync audiobook and ebook progress across Audiobookshelf, KOReader, Storyteller, BookOrbit and more.

# Developer plans and handoff notes stay in the repo but off the public site.
exclude_docs: |
  /ARCHITECTURE_*.md
  /OPTION_C_*.md
  /PLAN_*.md
  /PROMPT_*.md
  /SLICE*.md
  /epub-cover-memory-fix.md
  /issue-*.md
  /suggestions-redesign-backend-handoff.md
  /test-suite-performance.md
  /automated-review/
  /omni-bridge.md
  /security/
  /triage/

repo_name: cporcellijr/bookbridge
repo_url: https://github.com/cporcellijr/bookbridge

theme:
  name: material
  logo: assets/icon.png
  favicon: assets/icon.png
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode

    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:materialx.emoji.twemoji
      emoji_generator: !!python/name:materialx.emoji.to_svg

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - User Guide: user-guide.md
  - New Interface (Beta): new-interface.md
  - Configuration: configuration.md
  - Device API: device-api.md
  - Backup & Restore: backup-restore.md
  - Troubleshooting: troubleshooting.md
  - Changelog: changelog.md
